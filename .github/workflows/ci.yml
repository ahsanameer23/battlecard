name: CI — omada-nexus

on:
  push:
    branches: [main, "feat/**", "chore/**", "ci/**"]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_test
  NODE_ENV: test

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ── checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python setup ──────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt httpx

      # ── Node setup ────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # ── Database migrations ───────────────────────────────────
      - name: Create omada_nexus schema
        run: |
          psql "$DATABASE_URL" -c "CREATE SCHEMA IF NOT EXISTS omada_nexus;"

      - name: Run init.sql migration
        run: |
          if [ -f omada-nexus/database/init.sql ]; then
            psql "$DATABASE_URL" -f omada-nexus/database/init.sql
          fi

      - name: Run additional SQL migrations
        run: |
          for f in omada-nexus/database/*.sql; do
            [ -f "$f" ] && psql "$DATABASE_URL" -f "$f" || true
          done

      # ── Backend tests ─────────────────────────────────────────
      - name: Run pytest
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pytest tests/ -v --tb=short

      # ── Frontend build ────────────────────────────────────────
      - name: Build frontend
        run: npm run build

      # ── E2E smoke test ────────────────────────────────────────
      - name: Start backend server
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Run E2E smoke test
        run: node tests/e2e/smoke.test.js

      # ── Artifacts ─────────────────────────────────────────────
      - name: Upload frontend build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 7
