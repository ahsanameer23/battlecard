  postgres-password:      c3Ryb25ncGFzc3dvcmQ=   # REPLACE

  # echo -n "your_github_client_id" | base64
  github-client-id:       eW91cl9naXRodWJfY2xpZW50X2lk   # REPLACE

  # echo -n "your_github_client_secret" | base64
  github-client-secret:   eW91cl9naXRodWJfY2xpZW50X3NlY3JldA==   # REPLACE

  # (Optional) AWS credentials — delete if not using S3
  # aws-access-key-id:    <base64>
