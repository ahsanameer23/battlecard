name: Omada Nexus CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: omada_nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/omada_nexus
      GEMINI_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_API_KEY || 'dummy_key' }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Initialize Database Schema
      run: |
        PGPASSWORD=password psql -h localhost -U postgres -d omada_nexus -f database/init.sql

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Pytest
      run: |
        cd backend
        PYTHONPATH=. pytest tests/

    - name: Install Node Dependencies
      run: npm ci

    - name: Build Frontend
      run: npm run build

    - name: Start FastAPI Server
      run: |
        cd backend
        uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 5  # wait for server to start

    - name: Run E2E Smoke Tests
      run: |
        node tests/e2e/smoke.test.js

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: dist/
